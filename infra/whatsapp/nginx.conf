limit_req_zone $binary_remote_addr zone=olaki_whatsapp:1m rate=12r/m;
server {
    listen 80;
    listen [::]:80;
    server_name srv2031318.hstgr.cloud;
    location ^~ /.well-known/acme-challenge/ { root /srv/olaki/acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srv2031318.hstgr.cloud;
    ssl_certificate /etc/letsencrypt/live/olaki-whatsapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olaki-whatsapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = /message/sendText/olaki-verificacao {
        if ($request_method != POST) { return 405; }
        limit_req zone=olaki_whatsapp burst=5 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8087;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
    }
    location = /instance/connectionState/olaki-verificacao {
        if ($request_method != GET) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8087;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }
    # Administração e QR Code ficam disponíveis apenas pelo túnel SSH local.
    location / { return 404; }
}
